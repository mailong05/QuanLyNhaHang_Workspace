# ==========================================
# 🐳 DOCKER PROFILE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:sqlserver://sqlserver:1433;databaseName=QuanLyDatBanNhaHang;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong@Pass123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Auto-create / update tables in fresh Docker container
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# File Upload in container
app.upload.dir=/app/uploads/images/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwtSecret=${JWT_SECRET:DUMMY_SECRET_KEY_MUST_BE_LONG_ENOUGH_FOR_HMAC_SHA_256_AT_LEAST_32_BYTES_123456789}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
